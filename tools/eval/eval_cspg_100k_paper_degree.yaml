global:
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        to: "file:///tmp/vsag_eval_data/cspg_100k_paper_degree.json"

# baseline：HGraph NSW，max_degree=32
baseline_100k:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":1}}'
    search_params: '{"hgraph":{"ef_search":35}}'
    index_path: "./index/paper_degree_baseline_100k"
    search_mode: "knn"
    topk: 10
    build_base_limit: 100000
    search_query_limit: 500
    delete_index_after_search: false
    num_threads_building: 4
    num_threads_searching: 2

# CSPG m=2，旧行为：partition max_degree 缩减到 24（为兼容验证，显式写死）
cspg_100k_m2_degree24:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":2,"cspg_lambda":0.5,"cspg_partition_max_degree":24}}'
    search_params: '{"hgraph":{"ef_search":60,"cspg_ef1":1,"cspg_ef2":35,"cspg_enable_stats":true}}'
    index_path: "./index/paper_degree_cspg_m2_d24_100k"
    search_mode: "knn"
    topk: 10
    build_base_limit: 100000
    search_query_limit: 500
    enable_cspg_stats: true
    delete_index_after_search: false
    num_threads_building: 4
    num_threads_searching: 2

# CSPG m=2，新行为（论文对齐）：partition max_degree=32，与 baseline 相同
cspg_100k_m2_degree32:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":2,"cspg_lambda":0.5}}'
    search_params: '{"hgraph":{"ef_search":60,"cspg_ef1":1,"cspg_ef2":35,"cspg_enable_stats":true}}'
    index_path: "./index/paper_degree_cspg_m2_d32_100k"
    search_mode: "knn"
    topk: 10
    build_base_limit: 100000
    search_query_limit: 500
    enable_cspg_stats: true
    delete_index_after_search: false
    num_threads_building: 4
    num_threads_searching: 2

# 再跑一个搜索，验证 degree32 + ef2=20（更小 ef2 看是否能以低 ef2 换到同等 recall）
cspg_100k_m2_degree32_ef2_20:
