global:
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        to: "file:///tmp/vsag_eval_data/cspg_1m_nsw_fresh.json"

# baseline 1M，新鲜构建，作对照
baseline_1m:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":1}}'
    search_params: '{"hgraph":{"ef_search":20}}'
    index_path: "./index/nsw_fresh_baseline_1m"
    search_mode: "knn"
    topk: 10
    search_query_limit: 1000
    delete_index_after_search: false
    num_threads_building: 16
    num_threads_searching: 1

baseline_1m_ef30:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":1}}'
    search_params: '{"hgraph":{"ef_search":30}}'
    index_path: "./index/nsw_fresh_baseline_1m"
    search_mode: "knn"
    topk: 10
    search_query_limit: 1000
    delete_index_after_search: false
    num_threads_searching: 1

# CSPG 1M NSW，m=2 lambda=0.5（论文默认）
cspg_1m_nsw_m2_ef2_15:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":2,"cspg_lambda":0.5,"cspg_partition_graph_type":"nsw"}}'
    search_params: '{"hgraph":{"ef_search":60,"cspg_ef1":1,"cspg_ef2":15,"cspg_enable_stats":true}}'
    index_path: "./index/nsw_cspg_1m_m2_lambda05"
    search_mode: "knn"
    topk: 10
    search_query_limit: 1000
