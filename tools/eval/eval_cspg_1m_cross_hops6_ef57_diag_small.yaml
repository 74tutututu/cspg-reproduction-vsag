global:
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        to: "file:///tmp/vsag_eval_data/cspg_1m_cross_hops6_ef57_diag_small.json"

cspg_1m_partition32_ef2_57_cross_hops_6_diag_1k:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":2,"cspg_lambda":0.5}}'
    search_params: '{"hgraph":{"ef_search":60,"cspg_ef1":1,"cspg_ef2":57,"cspg_cross_partition_hops_limit":6,"cspg_phase1_use_route_descent":true,"cspg_enable_stats":true}}'
    index_path: "./index/hgraph_cspg_rebuild_index_fresh"
    search_mode: "knn"
    topk: 10
    range: 0.5
    search_query_limit: 1000
    enable_cspg_stats: true
    delete_index_after_search: false
    num_threads_searching: 2
