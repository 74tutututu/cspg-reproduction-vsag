global:
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        # 结果保存在当前目录
        to: "file://./eval_example_output.json" 
      send-to-influxdb:
        format: "line_protocol"
        to: "influxdb://127.0.0.1:8086/api/v2/write?org=7d71a0eb85deafbe&bucket=583a2fd8dd85e66c&precision=ns"
        vars:
          token: "Token mlIiP-zVfcooHhMbGG9Yk-KfrkHyDc2h-rphnIBda8UMe_6Qocy8tNmV323yxOPEAsC8uIs6_nb-XUSMEAO76A=="

eval_case1:
    # 统一从容器内公共目录读取数据，便于 baseline 和当前分支共用
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search" # `build` or `search` or `build,search`
    index_name: "hgraph"
    # 对比组：保持论文 CSPG 参数，提升 ef_construction 到 300 观察构图质量变化
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":2,"cspg_lambda":0.5}}'
    # CSPG 两阶段搜索：ef1=1；ef2=35 对齐 baseline ef20 附近 recall；
    # phase1 使用每个 partition 离线构建的 route levels 选择更好的进入点
    search_params: '{"hgraph":{"ef_search":60,"cspg_ef1":1,"cspg_ef2":35,"cspg_phase1_use_route_descent":true}}'
    # 索引保存在当前目录的 index 文件夹下
    index_path: "./index/hgraph_index"
    search_mode: "knn" # ["knn", "range", "knn_filter", "range_filter"]
    topk: 10
    range: 0.5
    delete_index_after_search: false # free up storage space used by index
    num_threads_building: 16
    num_threads_searching: 16
