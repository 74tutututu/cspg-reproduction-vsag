global:
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        to: "file:///tmp/vsag_eval_data/cspg_100k_fanout_sweep.json"

# baseline：无 CSPG，ef=35 作参考点
baseline_100k_ef35:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":1}}'
    search_params: '{"hgraph":{"ef_search":35}}'
    index_path: "./index/cspg_fanout_sweep_baseline_100k"
    search_mode: "knn"
    topk: 10
    build_base_limit: 100000
    search_query_limit: 500
    delete_index_after_search: false
    num_threads_building: 4
    num_threads_searching: 2

# CSPG m=4：fanout 不限（论文行为），stats 开启
cspg_100k_m4_fanout_unlimited:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":4,"cspg_lambda":0.5}}'
    search_params: '{"hgraph":{"ef_search":60,"cspg_ef1":1,"cspg_ef2":35,"cspg_enable_stats":true}}'
    index_path: "./index/cspg_fanout_sweep_m4_100k"
    search_mode: "knn"
    topk: 10
    build_base_limit: 100000
    search_query_limit: 500
    enable_cspg_stats: true
    delete_index_after_search: false
    num_threads_building: 4
    num_threads_searching: 2

# CSPG m=4：fanout=1，每次 routing 只向 1 个其他 partition 添加状态
cspg_100k_m4_fanout_1:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":4,"cspg_lambda":0.5}}'
    search_params: '{"hgraph":{"ef_search":60,"cspg_ef1":1,"cspg_ef2":35,"cspg_max_routing_fanout":1,"cspg_enable_stats":true}}'
    index_path: "./index/cspg_fanout_sweep_m4_100k"
    search_mode: "knn"
    topk: 10
    build_base_limit: 100000
    search_query_limit: 500
    enable_cspg_stats: true
    delete_index_after_search: false
    num_threads_building: 4
    num_threads_searching: 2

# CSPG m=4：fanout=2，每次 routing 最多向 2 个其他 partition 添加状态
cspg_100k_m4_fanout_2:
