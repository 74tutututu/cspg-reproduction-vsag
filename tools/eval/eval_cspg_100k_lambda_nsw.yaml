global:
    exporters:
      print-directly:
        format: "table"
        to: "stdout"
      save-to-file:
        format: "json"
        to: "file:///tmp/vsag_eval_data/cspg_100k_lambda_nsw.json"

# lambda=0.2：routing 比例降低，routing state overhead 应减少
cspg_100k_nsw_lambda02_ef2_15:
    datapath: "/workspaces/vsag/tools/eval/data/sift-128-euclidean.hdf5"
    type: "build,search"
    index_name: "hgraph"
    create_params: '{"dim":128,"dtype":"float32","metric_type":"l2","index_param":{"base_quantization_type":"fp32","max_degree":32,"ef_construction":300,"cspg_m":2,"cspg_lambda":0.2,"cspg_partition_graph_type":"nsw"}}'
    search_params: '{"hgraph":{"ef_search":60,"cspg_ef1":1,"cspg_ef2":15,"cspg_enable_stats":true}}'
    index_path: "./index/nsw_cspg_100k_m2_lambda02"
    search_mode: "knn"
    topk: 10
    build_base_limit: 100000
    search_query_limit: 500
    enable_cspg_stats: true
    delete_index_after_search: false
    num_threads_building: 4
    num_threads_searching: 2

